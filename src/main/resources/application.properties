# ==============================
# MEDCARE Backend Configuration
# ==============================

# Server
server.port=8080

# Application
spring.application.name=medcare-backend

# ==============================
# Database MySQL 8
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/medcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================
# JWT Configuration
# ==============================
app.jwt.secret=medcare-super-secret-key-which-is-very-long-and-secure-2024-medicale-1234567890
app.jwt.expiration-ms=86400000

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
