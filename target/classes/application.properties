# ==============================
# MEDCARE Backend Configuration
# ==============================

# Server
server.port=8080

# Application
spring.application.name=medcare-backend

# ==============================
# Database H2 (in-memory)
# ==============================
spring.datasource.url=jdbc:h2:mem:medcare_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 Console (debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# JWT Configuration
# ==============================
app.jwt.secret=medcare-super-secret-key-which-is-very-long-and-secure-2024-medicale-1234567890
app.jwt.expiration-ms=86400000

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
